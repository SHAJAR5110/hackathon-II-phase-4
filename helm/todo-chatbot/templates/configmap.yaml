apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "todo-chatbot.labels" . | nindent 4 }}
data:
  # Backend service URL for frontend
  BACKEND_URL: {{ .Values.config.backendUrl | quote }}

  # Application environment
  APP_ENV: {{ .Values.config.appEnv | quote }}
  DEBUG: {{ .Values.config.debug | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}

  # JWT Configuration
  JWT_ALGORITHM: {{ .Values.config.jwtAlgorithm | quote }}
  JWT_EXPIRATION_DAYS: {{ .Values.config.jwtExpirationDays | quote }}

  # CORS Configuration
  ALLOWED_ORIGINS: {{ .Values.config.allowedOrigins | quote }}
