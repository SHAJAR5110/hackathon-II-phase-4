apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "todo-chatbot.backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: {{ .Values.strategy.type }}
    {{- if eq .Values.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.strategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "todo-chatbot.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "todo-chatbot.backend.labels" . | nindent 8 }}
    spec:
      restartPolicy: {{ .Values.restartPolicy }}
      {{- if .Values.securityContext }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Values.backend.name }}
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.backend.service.targetPort }}
          protocol: TCP
        env:
        # Non-sensitive configuration from ConfigMap
        - name: BACKEND_URL
          valueFrom:
            configMapKeyRef:
              name: {{ .Release.Name }}-config
              key: BACKEND_URL
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: {{ .Release.Name }}-config
              key: APP_ENV
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: {{ .Release.Name }}-config
              key: DEBUG
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: {{ .Release.Name }}-config
              key: LOG_LEVEL
        - name: JWT_ALGORITHM
          valueFrom:
            configMapKeyRef:
              name: {{ .Release.Name }}-config
              key: JWT_ALGORITHM
        - name: JWT_EXPIRATION_DAYS
          valueFrom:
            configMapKeyRef:
              name: {{ .Release.Name }}-config
              key: JWT_EXPIRATION_DAYS
        - name: ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: {{ .Release.Name }}-config
              key: ALLOWED_ORIGINS
        # Sensitive data from Secrets
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secrets
              key: DATABASE_URL
        - name: BETTER_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secrets
              key: BETTER_AUTH_SECRET

        # Liveness probe: Restarts container if failing (includes database check)
        livenessProbe:
          {{- toYaml .Values.backend.livenessProbe | nindent 10 }}

        # Readiness probe: Removes from service if failing
        readinessProbe:
          {{- toYaml .Values.backend.readinessProbe | nindent 10 }}

        # Resource constraints
        resources:
          {{- toYaml .Values.backend.resources | nindent 10 }}

      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
