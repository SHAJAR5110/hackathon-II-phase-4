apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "todo-chatbot.labels" . | nindent 4 }}
type: Opaque
data:
  # Base64-encoded sensitive data
  # NOTE: These values are provided at deployment time via --set flag
  # Never commit actual secrets to git
  DATABASE_PASSWORD: {{ .Values.secrets.databasePassword | b64enc | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | b64enc | quote }}
